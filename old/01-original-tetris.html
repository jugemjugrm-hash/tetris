<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テトリス</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #1a1c33;
    --line: #2e3157;
    --text: #e6e8ff;
    --dim: #8f93c0;
    --accent: #56d1dc;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #1c1f3d 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    overflow: hidden;
  }
  #app {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    gap: 22px;
    padding: 16px;
  }
  .stage { position: relative; }
  canvas { display: block; }
  #board {
    background: #0a0b17;
    border: 2px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(86, 209, 220, .12), inset 0 0 60px rgba(0,0,0,.6);
    touch-action: none;
  }
  .side {
    display: flex; flex-direction: column; gap: 14px;
    width: 168px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--dim); font-weight: 600;
  }
  .stat { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0; }
  .stat span:first-child { color: var(--dim); font-size: 12px; }
  .stat span:last-child { font-size: 19px; font-variant-numeric: tabular-nums; font-weight: 700; }
  .keys { font-size: 11.5px; line-height: 1.9; color: var(--dim); }
  .keys b { color: var(--text); font-weight: 600; }
  #overlay {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center;
    background: rgba(10, 11, 23, .86);
    border-radius: 6px;
  }
  #overlay.show { display: flex; }
  #overlay .title { font-size: 30px; font-weight: 800; letter-spacing: .05em; }
  #overlay .sub { font-size: 13px; color: var(--dim); }
  #toast {
    position: absolute; left: 0; right: 0; top: 34%;
    text-align: center; pointer-events: none;
    font-size: 22px; font-weight: 800; letter-spacing: .06em;
    color: var(--accent); text-shadow: 0 0 18px rgba(86,209,220,.6);
    opacity: 0; transition: opacity .25s;
  }
  #toast.show { opacity: 1; }

  /* タイトル画面 */
  #title {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    background: linear-gradient(180deg, rgba(10,11,23,.92), rgba(15,16,32,.97));
    border-radius: 6px;
  }
  #title.show { display: flex; }
  .logo {
    display: flex; gap: 4px;
    font-size: 44px; font-weight: 900; letter-spacing: .04em; line-height: 1;
  }
  .logo span {
    display: inline-block;
    text-shadow: 0 0 16px currentColor;
    animation: bob 2.4s ease-in-out infinite;
  }
  .logo span:nth-child(2) { animation-delay: .15s; }
  .logo span:nth-child(3) { animation-delay: .30s; }
  .logo span:nth-child(4) { animation-delay: .45s; }
  .logo span:nth-child(5) { animation-delay: .60s; }
  .logo span:nth-child(6) { animation-delay: .75s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .logo-sub { font-size: 13px; letter-spacing: .5em; color: var(--dim); margin-top: -8px; }
  .hiscore {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 22px;
    min-width: 200px;
  }
  .hiscore .label { font-size: 11px; letter-spacing: .2em; color: var(--dim); }
  .hiscore .value {
    font-size: 30px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #ffd93d; text-shadow: 0 0 14px rgba(255,217,61,.45);
  }
  .btn {
    appearance: none; cursor: pointer;
    font: inherit; font-size: 17px; font-weight: 800; letter-spacing: .2em;
    color: #0a0b17;
    background: var(--accent);
    border: none; border-radius: 999px;
    padding: 12px 40px;
    box-shadow: 0 6px 0 #2a8d95, 0 0 24px rgba(86,209,220,.35);
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2a8d95, 0 0 24px rgba(86,209,220,.35); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .btn.ghost {
    color: var(--text); background: transparent;
    border: 1px solid var(--line); box-shadow: none;
    font-size: 13px; padding: 9px 22px;
  }
  .btn.ghost:active { transform: none; }
  .hint { font-size: 11px; color: var(--dim); letter-spacing: .1em; }
  .btn-row { display: flex; gap: 10px; }
  @media (max-width: 620px) {
    #app { flex-direction: column; gap: 12px; }
    .side { flex-direction: row; width: auto; }
    .card.keys-card { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="stage">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="toast"></div>

    <!-- タイトル画面 -->
    <div id="title">
      <div>
        <div class="logo">
          <span style="color:#ff5c72">T</span><span style="color:#ff9f45">E</span><span style="color:#ffd93d">T</span><span style="color:#4ad991">R</span><span style="color:#37d3e8">I</span><span style="color:#c07dff">S</span>
        </div>
        <div class="logo-sub">テトリス</div>
      </div>
      <div class="hiscore">
        <div class="label">HIGH SCORE</div>
        <div class="value" id="titleBest">0</div>
      </div>
      <button class="btn" id="startBtn" type="button">START</button>
      <div class="hint">Enter / Space でもスタート</div>
    </div>

    <!-- ポーズ / ゲームオーバー -->
    <div id="overlay">
      <div class="title" id="ovTitle">PAUSE</div>
      <div class="sub" id="ovSub"></div>
      <div class="btn-row" id="ovButtons">
        <button class="btn ghost" id="retryBtn" type="button">もう一度</button>
        <button class="btn ghost" id="titleBtn" type="button">タイトルへ</button>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h2>Hold</h2>
      <canvas id="hold" width="140" height="70"></canvas>
    </div>
    <div class="card">
      <h2>Next</h2>
      <canvas id="next" width="140" height="250"></canvas>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <div class="stat"><span>SCORE</span><span id="score">0</span></div>
      <div class="stat"><span>LINES</span><span id="lines">0</span></div>
      <div class="stat"><span>LEVEL</span><span id="level">1</span></div>
      <div class="stat"><span>BEST</span><span id="best">0</span></div>
    </div>
    <div class="card keys-card">
      <h2>Controls</h2>
      <div class="keys">
        <b>&larr; &rarr;</b> 移動<br>
        <b>&darr;</b> ソフトドロップ<br>
        <b>Space</b> ハードドロップ<br>
        <b>&uarr; / X</b> 右回転<br>
        <b>Z</b> 左回転<br>
        <b>C</b> ホールド<br>
        <b>P</b> 一時停止<br>
        <b>R</b> リスタート
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 10, ROWS = 20, HIDDEN = 2, CELL = 30;
  var TOTAL_ROWS = ROWS + HIDDEN;

  var COLORS = {
    I: '#37d3e8', J: '#4a7dff', L: '#ff9f45',
    O: '#ffd93d', S: '#4ad991', T: '#c07dff', Z: '#ff5c72'
  };

  // 各ミノの4回転分の形状 (0=spawn, 1=R, 2=180, 3=L)
  var SHAPES = {
    I: [[[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]],
        [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]]],
    J: [[[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]],
        [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]]],
    L: [[[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]],
        [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]]],
    O: [[[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]],
        [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]]],
    S: [[[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]],
        [[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]]],
    T: [[[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]],
        [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]]],
    Z: [[[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]],
        [[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]]]
  };

  // SRS ウォールキック (x, y は上方向を正とする標準表記)
  var KICKS_JLSTZ = {
    '0>1': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '1>0': [[0,0],[1,0],[1,-1],[0,2],[1,2]],
    '1>2': [[0,0],[1,0],[1,-1],[0,2],[1,2]],
    '2>1': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '2>3': [[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '3>2': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '3>0': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '0>3': [[0,0],[1,0],[1,1],[0,-2],[1,-2]]
  };
  var KICKS_I = {
    '0>1': [[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
    '1>0': [[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
    '1>2': [[0,0],[-1,0],[2,0],[-1,2],[2,-1]],
    '2>1': [[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
    '2>3': [[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
    '3>2': [[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
    '3>0': [[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
    '0>3': [[0,0],[-1,0],[2,0],[-1,2],[2,-1]]
  };

  var boardCv = document.getElementById('board');
  var bctx = boardCv.getContext('2d');
  var nextCv = document.getElementById('next');
  var nctx = nextCv.getContext('2d');
  var holdCv = document.getElementById('hold');
  var hctx = holdCv.getContext('2d');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var toastEl = document.getElementById('toast');
  var titleEl = document.getElementById('title');
  var titleBest = document.getElementById('titleBest');
  var startBtn = document.getElementById('startBtn');
  var ovButtons = document.getElementById('ovButtons');
  var retryBtn = document.getElementById('retryBtn');
  var titleBtn = document.getElementById('titleBtn');
  var el = {
    score: document.getElementById('score'),
    lines: document.getElementById('lines'),
    level: document.getElementById('level'),
    best: document.getElementById('best')
  };

  var grid, bag, queue, current, holdType, canHold;
  var score, lines, level, best, combo, backToBack, newBest;
  var dropTimer, lockTimer, lockResets;
  var state = 'ready';   // ready | playing | paused | over
  var lastTime = 0, clearing = null, toastTimer = null;

  try { best = parseInt(localStorage.getItem('tetris.best') || '0', 10) || 0; }
  catch (e) { best = 0; }

  function emptyGrid() {
    var g = [];
    for (var y = 0; y < TOTAL_ROWS; y++) {
      var row = [];
      for (var x = 0; x < COLS; x++) row.push(null);
      g.push(row);
    }
    return g;
  }

  // 7種1巡のランダムバッグ
  function pullType() {
    if (bag.length === 0) {
      var types = ['I', 'J', 'L', 'O', 'S', 'T', 'Z'];
      for (var i = types.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = types[i]; types[i] = types[j]; types[j] = tmp;
      }
      bag = types;
    }
    return bag.shift();
  }

  function cellsOf(p, rot, x, y) {
    rot = (rot === undefined) ? p.rot : rot;
    x = (x === undefined) ? p.x : x;
    y = (y === undefined) ? p.y : y;
    var shape = SHAPES[p.type][((rot % 4) + 4) % 4];
    var out = [];
    for (var i = 0; i < shape.length; i++) {
      out.push([x + shape[i][0], y + shape[i][1]]);
    }
    return out;
  }

  function valid(p, rot, x, y) {
    var cells = cellsOf(p, rot, x, y);
    for (var i = 0; i < cells.length; i++) {
      var cx = cells[i][0], cy = cells[i][1];
      if (cx < 0 || cx >= COLS || cy >= TOTAL_ROWS) return false;
      if (cy >= 0 && grid[cy][cx]) return false;
    }
    return true;
  }

  function newPiece(type) {
    // y=1 でスポーンさせると、ミノの下段が最上部の可視行に出る
    current = { type: type || pullType(), rot: 0, x: 3, y: 1 };
    while (queue.length < 5) queue.push(pullType());
    lockTimer = null; lockResets = 0; dropTimer = 0;
    if (!valid(current)) gameOver();
  }

  function reset() {
    grid = emptyGrid();
    bag = []; queue = [];
    holdType = null; canHold = true;
    score = 0; lines = 0; level = 1; combo = -1; backToBack = false; newBest = false;
    dropTimer = 0; lockTimer = null; lockResets = 0; clearing = null;
    for (var i = 0; i < 5; i++) queue.push(pullType());
    newPiece(queue.shift());
    updateHUD();
  }

  // レベルごとの自然落下間隔 (ms)
  function gravityInterval() {
    var base = Math.pow(0.8 - (level - 1) * 0.007, level - 1) * 1000;
    return Math.max(40, base);
  }

  function resetLockDelay() {
    if (lockTimer !== null && lockResets < 15) { lockTimer = 0; lockResets++; }
  }

  function move(dx, dy) {
    if (!valid(current, current.rot, current.x + dx, current.y + dy)) return false;
    current.x += dx; current.y += dy;
    resetLockDelay();
    return true;
  }

  function rotate(dir) {
    var from = current.rot;
    var to = ((from + dir) % 4 + 4) % 4;
    if (current.type === 'O') { current.rot = to; return true; }
    var table = (current.type === 'I') ? KICKS_I : KICKS_JLSTZ;
    var kicks = table[from + '>' + to] || [[0, 0]];
    for (var i = 0; i < kicks.length; i++) {
      var nx = current.x + kicks[i][0];
      var ny = current.y - kicks[i][1];   // 画面座標は下方向が正なので反転
      if (valid(current, to, nx, ny)) {
        current.rot = to; current.x = nx; current.y = ny;
        resetLockDelay();
        return true;
      }
    }
    return false;
  }

  function ghostY() {
    var y = current.y;
    while (valid(current, current.rot, current.x, y + 1)) y++;
    return y;
  }

  function hardDrop() {
    var target = ghostY();
    score += (target - current.y) * 2;
    current.y = target;
    lock();
  }

  function hold() {
    if (!canHold || !current) return;
    var stored = holdType;
    holdType = current.type;
    canHold = false;
    if (stored) newPiece(stored);
    else newPiece(queue.shift());
  }

  function lock() {
    var cells = cellsOf(current);
    for (var i = 0; i < cells.length; i++) {
      var cx = cells[i][0], cy = cells[i][1];
      if (cy >= 0) grid[cy][cx] = current.type;
    }
    var full = [];
    for (var y = 0; y < TOTAL_ROWS; y++) {
      var complete = true;
      for (var x = 0; x < COLS; x++) if (!grid[y][x]) { complete = false; break; }
      if (complete) full.push(y);
    }
    if (full.length) {
      scoreClear(full.length);
      clearing = { rows: full, t: 0 };
      current = null;
    } else {
      combo = -1;
      nextTurn();
    }
  }

  function nextTurn() {
    canHold = true;
    newPiece(queue.shift());
  }

  function scoreClear(n) {
    var base = [0, 100, 300, 500, 800][n];
    var gained = base * level;
    var isTetris = (n === 4);
    if (isTetris && backToBack) gained = Math.round(gained * 1.5);
    backToBack = isTetris;
    combo++;
    if (combo > 0) gained += 50 * combo * level;
    score += gained;
    lines += n;

    var newLevel = Math.floor(lines / 10) + 1;
    if (newLevel > level) {
      level = newLevel;
      showToast('LEVEL ' + level);
    } else {
      var name = ['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS!'][n];
      showToast(name + (combo > 0 ? ' x' + (combo + 1) : ''));
    }

    updateBest();
    updateHUD();
  }

  function updateBest() {
    if (score > best) {
      best = score;
      newBest = true;
      try { localStorage.setItem('tetris.best', String(best)); } catch (e) {}
    }
  }

  function removeRows(rows) {
    for (var i = 0; i < rows.length; i++) {
      grid.splice(rows[i], 1);
      var row = [];
      for (var x = 0; x < COLS; x++) row.push(null);
      grid.unshift(row);
    }
  }

  function gameOver() {
    state = 'over';
    current = null;
    updateBest();   // ライン消去なしでもハイスコアを反映
    updateHUD();
    ovTitle.textContent = 'GAME OVER';
    ovSub.textContent = 'SCORE ' + score + (newBest ? '  ★ NEW RECORD!' : '') + '  /  Enter でもう一度';
    ovButtons.style.display = 'flex';
    overlay.classList.add('show');
  }

  function showTitle() {
    state = 'ready';
    current = null;
    clearing = null;
    grid = emptyGrid();
    queue = []; holdType = null; canHold = true;
    overlay.classList.remove('show');
    titleBest.textContent = best;
    titleEl.classList.add('show');
    startBtn.focus();
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 750);
  }

  function updateHUD() {
    el.score.textContent = score;
    el.lines.textContent = lines;
    el.level.textContent = level;
    el.best.textContent = best;
  }

  // ---------- 描画 ----------
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.min(255, Math.max(0, (n >> 16) + amt));
    var g = Math.min(255, Math.max(0, ((n >> 8) & 255) + amt));
    var b = Math.min(255, Math.max(0, (n & 255) + amt));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function drawCell(ctx, px, py, size, color, alpha) {
    ctx.globalAlpha = (alpha === undefined) ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.fillRect(px, py, size, size);
    ctx.fillStyle = shade(color, 45);
    ctx.fillRect(px, py, size, size * 0.16);
    ctx.fillStyle = shade(color, -60);
    ctx.fillRect(px, py + size * 0.84, size, size * 0.16);
    ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);
    ctx.globalAlpha = 1;
  }

  function drawGridLines() {
    bctx.strokeStyle = 'rgba(255,255,255,.05)';
    bctx.lineWidth = 1;
    for (var x = 1; x < COLS; x++) {
      bctx.beginPath();
      bctx.moveTo(x * CELL + 0.5, 0);
      bctx.lineTo(x * CELL + 0.5, ROWS * CELL);
      bctx.stroke();
    }
    for (var y = 1; y < ROWS; y++) {
      bctx.beginPath();
      bctx.moveTo(0, y * CELL + 0.5);
      bctx.lineTo(COLS * CELL, y * CELL + 0.5);
      bctx.stroke();
    }
  }

  function render() {
    bctx.fillStyle = '#0a0b17';
    bctx.fillRect(0, 0, boardCv.width, boardCv.height);
    drawGridLines();

    var flash = null;
    if (clearing) {
      flash = {};
      for (var i = 0; i < clearing.rows.length; i++) flash[clearing.rows[i]] = true;
    }

    for (var y = HIDDEN; y < TOTAL_ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var t = grid[y][x];
        if (!t) continue;
        var py = (y - HIDDEN) * CELL;
        if (flash && flash[y]) {
          var a = 0.35 + 0.5 * Math.abs(Math.sin(clearing.t / 40));
          bctx.fillStyle = 'rgba(255,255,255,' + a + ')';
          bctx.fillRect(x * CELL, py, CELL, CELL);
        } else {
          drawCell(bctx, x * CELL, py, CELL, COLORS[t]);
        }
      }
    }

    if (current && !clearing) {
      var gy = ghostY();
      var g = cellsOf(current, current.rot, current.x, gy);
      for (var i2 = 0; i2 < g.length; i2++) {
        if (g[i2][1] >= HIDDEN) {
          drawCell(bctx, g[i2][0] * CELL, (g[i2][1] - HIDDEN) * CELL, CELL, COLORS[current.type], 0.22);
        }
      }
      var c = cellsOf(current);
      for (var i3 = 0; i3 < c.length; i3++) {
        if (c[i3][1] >= HIDDEN) {
          drawCell(bctx, c[i3][0] * CELL, (c[i3][1] - HIDDEN) * CELL, CELL, COLORS[current.type]);
        }
      }
    }
  }

  function drawMini(ctx, cv, type, top, size) {
    if (!type) return;
    var cells = SHAPES[type][0];
    var minX = 9, maxX = -9, minY = 9, maxY = -9;
    for (var i = 0; i < cells.length; i++) {
      minX = Math.min(minX, cells[i][0]); maxX = Math.max(maxX, cells[i][0]);
      minY = Math.min(minY, cells[i][1]); maxY = Math.max(maxY, cells[i][1]);
    }
    var w = (maxX - minX + 1) * size;
    var h = (maxY - minY + 1) * size;
    var ox = (cv.width - w) / 2 - minX * size;
    var oy = top + (size * 2 - h) / 2 - minY * size;
    for (var j = 0; j < cells.length; j++) {
      drawCell(ctx, ox + cells[j][0] * size, oy + cells[j][1] * size, size, COLORS[type]);
    }
  }

  function renderSide() {
    nctx.clearRect(0, 0, nextCv.width, nextCv.height);
    for (var i = 0; i < queue.length && i < 5; i++) {
      drawMini(nctx, nextCv, queue[i], i * 50 + 5, 20);
    }
    hctx.clearRect(0, 0, holdCv.width, holdCv.height);
    hctx.globalAlpha = canHold ? 1 : 0.35;
    drawMini(hctx, holdCv, holdType, 15, 20);
    hctx.globalAlpha = 1;
  }

  // ---------- メインループ ----------
  function tick(now) {
    requestAnimationFrame(tick);
    var dt = Math.min(100, now - (lastTime || now));
    lastTime = now;

    if (state === 'playing') {
      if (clearing) {
        clearing.t += dt;
        if (clearing.t >= 250) {
          removeRows(clearing.rows);
          clearing = null;
          nextTurn();
        }
      } else if (current) {
        var interval = gravityInterval();
        dropTimer += dt;
        while (dropTimer >= interval) {
          dropTimer -= interval;
          if (valid(current, current.rot, current.x, current.y + 1)) {
            current.y++;
          } else {
            break;
          }
        }
        // 接地判定とロックディレイ
        if (!valid(current, current.rot, current.x, current.y + 1)) {
          if (lockTimer === null) lockTimer = 0;
          lockTimer += dt;
          if (lockTimer >= 500) lock();
        } else {
          lockTimer = null;
        }
      }
    }

    render();
    renderSide();
  }

  // ---------- 入力 ----------
  var held = { left: false, right: false, down: false };
  var DAS = 150, ARR = 40, SOFT = 45;
  var dasDir = 0, dasTimer = 0, softTimer = 0;

  function startGame() {
    reset();
    state = 'playing';
    dasDir = 0; held.left = held.right = held.down = false;
    titleEl.classList.remove('show');
    overlay.classList.remove('show');
    startBtn.blur();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      ovTitle.textContent = 'PAUSE';
      ovSub.textContent = 'P または Enter で再開';
      ovButtons.style.display = 'none';
      overlay.classList.add('show');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.classList.remove('show');
    }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault();
    }
    if (e.repeat) return;

    // タイトル画面: Enter / Space で開始
    if (state === 'ready') {
      if (k === 'Enter' || k === ' ') startGame();
      return;
    }
    if (k === 'Enter') {
      if (state === 'over') startGame();
      else if (state === 'paused') togglePause();
      return;
    }
    if (k === 'Escape') {
      if (state === 'over' || state === 'paused') showTitle();
      return;
    }
    if (k === 'r' || k === 'R') { if (state !== 'ready') startGame(); return; }
    if (k === 'p' || k === 'P') { togglePause(); return; }
    if (state !== 'playing' || clearing || !current) return;

    switch (k) {
      case 'ArrowLeft':
        held.left = true; dasDir = -1; dasTimer = 0; move(-1, 0); break;
      case 'ArrowRight':
        held.right = true; dasDir = 1; dasTimer = 0; move(1, 0); break;
      case 'ArrowDown':
        held.down = true; softTimer = 0;
        if (move(0, 1)) { score += 1; dropTimer = 0; updateHUD(); }
        break;
      case 'ArrowUp': case 'x': case 'X': rotate(1); break;
      case 'z': case 'Z': case 'Control': rotate(-1); break;
      case 'a': case 'A': rotate(2); break;
      case ' ': hardDrop(); updateHUD(); break;
      case 'c': case 'C': case 'Shift': hold(); break;
    }
  });

  document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') { held.left = false; dasDir = held.right ? 1 : 0; dasTimer = 0; }
    if (e.key === 'ArrowRight') { held.right = false; dasDir = held.left ? -1 : 0; dasTimer = 0; }
    if (e.key === 'ArrowDown') held.down = false;
  });

  // DAS / ARR とソフトドロップのオートリピート
  setInterval(function () {
    if (state !== 'playing' || clearing || !current) return;
    if (dasDir !== 0) {
      dasTimer += 16;
      while (dasTimer >= DAS + ARR) { move(dasDir, 0); dasTimer -= ARR; }
    }
    if (held.down) {
      softTimer += 16;
      while (softTimer >= SOFT) {
        softTimer -= SOFT;
        if (move(0, 1)) { score += 1; dropTimer = 0; updateHUD(); }
        else break;
      }
    }
  }, 16);

  startBtn.addEventListener('click', function () {
    if (state === 'ready') startGame();
  });
  retryBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (state === 'over') startGame();
  });
  titleBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (state === 'over') showTitle();
  });
  overlay.addEventListener('click', function () {
    if (state === 'paused') togglePause();
  });

  // ---------- タッチ操作 ----------
  var touch = null;
  boardCv.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touch = { x: t.clientX, y: t.clientY, sy: t.clientY, time: Date.now(), moved: false };
    e.preventDefault();
  }, { passive: false });

  boardCv.addEventListener('touchmove', function (e) {
    if (!touch || state !== 'playing' || !current) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 1 : -1, 0);
      touch.x = t.clientX; touch.moved = true;
    } else if (dy > 26) {
      if (move(0, 1)) { score += 1; updateHUD(); }
      touch.y = t.clientY; touch.moved = true;
    }
    e.preventDefault();
  }, { passive: false });

  boardCv.addEventListener('touchend', function (e) {
    if (!touch) return;
    var t = e.changedTouches[0];
    var totalY = t.clientY - touch.sy;
    var elapsed = Date.now() - touch.time;
    if (state === 'playing' && current) {
      if (!touch.moved && elapsed < 250) rotate(1);
      else if (totalY > 130 && elapsed < 400) { hardDrop(); updateHUD(); }
    }
    touch = null;
    e.preventDefault();
  }, { passive: false });

  // ---------- 起動 ----------
  reset();       // スコア表示などの初期化
  showTitle();   // タイトル画面から開始
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
